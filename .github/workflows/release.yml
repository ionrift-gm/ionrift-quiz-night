name: Release Creation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate zip only; do not create a GitHub release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MODULE_VERSION=$(python3 -c "import json; d=json.load(open('module.json')); print(d['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MODULE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: module.json version ($MODULE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "OK: module.json version $MODULE_VERSION matches tag $TAG_VERSION"

      - name: Zip Module
        run: |
          zip -r module.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "*.log" \
            -x "*.lock" \
            -x "playwright-realtime.log"

      - name: Verify ZIP sanity
        run: |
          echo "--- ZIP contents ---"
          unzip -l module.zip
          for REQUIRED in module.json scripts/module.js scripts/utils/itemDrop.js templates/ styles/; do
            if ! unzip -Z1 module.zip | grep -q "^${REQUIRED}"; then
              echo "ERROR: Release is missing ${REQUIRED}"
              exit 1
            fi
          done
          if unzip -l module.zip | grep -qE "(\.git/|\.github/|node_modules/|vitest)"; then
            echo "ERROR: ZIP contains excluded paths"
            exit 1
          fi
          echo "OK: Manifest, entry, prize drop helper, templates, and styles are present"

      - name: Create Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.zip
            module.json
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-ea') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          make_latest: ${{ !(contains(github.ref_name, '-ea') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}

      - name: Notify Foundry VTT
        if: github.event.inputs.dry_run != 'true' && success() && !(contains(github.ref_name, '-ea') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha'))
        uses: actions/github-script@v7
        env:
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));

            const payload = {
              id: manifest.id,
              release: {
                version: manifest.version,
                manifest: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/latest/download/module.json`,
                notes: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${manifest.version}`,
                compatibility: manifest.compatibility
              }
            };

            console.log("Sending payload:", JSON.stringify(payload, null, 2));

            const response = await fetch("https://foundryvtt.com/_api/packages/release_version/", {
              method: "POST",
              headers: { 'Content-Type': 'application/json', 'Authorization': process.env.FOUNDRY_TOKEN },
              body: JSON.stringify(payload)
            });

            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { data = text; }
            console.log("Response:", typeof data === 'string' ? data : JSON.stringify(data, null, 2));

            if (!response.ok) {
              core.setFailed(`Foundry API Error (${response.status}): ${typeof data === 'string' ? data : JSON.stringify(data)}`);
            } else {
              console.log("Foundry VTT notified successfully.");
            }
